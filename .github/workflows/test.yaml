---
name: Test
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-test:
    name: Python Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - cart-service
          - catalog-service
          - checkout-service
          - incident-engine
          - inventory-service
          - order-service
          - synthetic-monitor
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Go for gateway interoperability tests
        if: >-
          ${{ matrix.service == 'checkout-service' ||
              matrix.service == 'order-service' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/payment-gateway/go.mod
          cache-dependency-path: services/payment-gateway/go.sum

      - name: Warm payment gateway build cache
        if: >-
          ${{ matrix.service == 'checkout-service' ||
              matrix.service == 'order-service' }}
        working-directory: services/payment-gateway
        run: go build ./...

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Run pytest
        run: uv run --frozen pytest

  go-test:
    name: Go Tests (payment-gateway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/payment-gateway/go.mod
          cache-dependency-path: services/payment-gateway/go.sum

      - name: Run Go tests with race detector
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-payment-gateway
          path: services/payment-gateway/coverage.out
          retention-days: 7
