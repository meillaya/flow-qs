---
name: Test
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-test:
    name: Python Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - cart-service
          - catalog-service
          - checkout-service
          - incident-engine
          - inventory-service
          - order-service
          - synthetic-monitor
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run pytest with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          retention-days: 7

  go-test:
    name: Go Tests (payment-gateway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/payment-gateway/go.mod
          cache-dependency-path: services/payment-gateway/go.sum

      - name: Run Go tests with race detector
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-payment-gateway
          path: services/payment-gateway/coverage.out
          retention-days: 7
