---
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: dns-chaos-inventory
  namespace: chaos-testing
spec:
  schedule: "@every 60s"
  historyLimit: 5
  concurrencyPolicy: Forbid
  type: DNSChaos
  dnsChaos:
    action: random
    mode: all
    selector:
      namespaces:
        - ecom
      labelSelectors:
        app.kubernetes.io/name: inventory-service
    patterns:
      - "inventory-service.ecom.svc.cluster.local"
      - "*.inventory-service.ecom.svc.cluster.local"
    duration: 2m
