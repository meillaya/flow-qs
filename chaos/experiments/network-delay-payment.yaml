---
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: network-delay-payment
  namespace: chaos-testing
spec:
  schedule: "@every 60s"
  historyLimit: 5
  concurrencyPolicy: Forbid
  type: NetworkChaos
  networkChaos:
    action: delay
    mode: all
    selector:
      namespaces:
        - ecom
      labelSelectors:
        app.kubernetes.io/name: checkout-service
    delay:
      latency: 2000ms
      correlation: "100"
      jitter: 0ms
    direction: from
    target:
      mode: all
      selector:
        namespaces:
          - ecom
        labelSelectors:
          app.kubernetes.io/name: payment-gateway
    duration: 5m
