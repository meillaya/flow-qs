apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-payment
  namespace: chaos-testing
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - ecom
  delay:
    latency: 2000ms
    correlation: "100"
    jitter: 0ms
  externalTargets:
    - "payment-gateway.ecom.svc.cluster.local"
  direction: to
  duration: 5m
