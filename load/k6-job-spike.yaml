---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-spike-script
  namespace: load
data:
  spike.js: |
      const http = require("k6/http");
      const { check, sleep } = require("k6");
      const { Rate } = require("k6/metrics");

      const NS = __ENV.SERVICE_NAMESPACE || "ecom";
      const CART_URL = __ENV.CART_URL || `http://cart-service.${NS}:8002`;
      const CHECKOUT_URL = __ENV.CHECKOUT_URL ||
        `http://checkout-service-checkout-service.${NS}:8003`;
      const checkoutSuccessRate = new Rate("checkout_success_rate");

      exports.options = {
        stages: [
          { duration: "10s", target: 10 },
          { duration: "10s", target: 500 },
          { duration: "30s", target: 500 },
          { duration: "10s", target: 10 },
        ],
        thresholds: {
          http_req_duration: ["p(95)<2000"],
          http_req_failed: ["rate<0.10"],
          checkout_success_rate: ["rate>0.90"],
        },
      };

      const HEALTH_ENDPOINTS = [
        `http://catalog-service.${NS}:8000/healthz`,
        `http://inventory-service.${NS}:8001/healthz`,
        `http://cart-service.${NS}:8002/healthz`,
        `http://checkout-service-checkout-service.${NS}:8003/healthz`,
        `http://order-service.${NS}:8004/healthz`,
        `http://payment-gateway.${NS}:8005/healthz`,
      ];

      exports.default = function () {
        const healthUrl =
          HEALTH_ENDPOINTS[Math.floor(Math.random() * HEALTH_ENDPOINTS.length)];
        const res = http.get(healthUrl, { tags: { step: "health" } });

        check(res, {
          "health status is 200": (r) => r.status === 200,
        });

        if (Math.random() < 0.005) {
          const userId = `spike-${__VU}-${Date.now()}`;
          const cartRes = http.post(
            `${CART_URL}/cart/${userId}/items`,
            JSON.stringify({
              sku: `SKU-${String((__ITER + __VU) % 20 + 1).padStart(3, "0")}`,
              qty: 1,
            }),
            {
              headers: { "Content-Type": "application/json" },
              tags: { step: "add_to_cart" },
            },
          );
          const checkoutRes = cartRes.status === 200
            ? http.post(
              `${CHECKOUT_URL}/checkout`,
              JSON.stringify({ user_id: userId, payment_method: "card" }),
              {
                headers: { "Content-Type": "application/json" },
                tags: { step: "checkout" },
              },
            )
            : null;
          const checkoutOk = checkoutRes !== null &&
            checkoutRes.status === 200 &&
            checkoutRes.json("status") === "paid";
          checkoutSuccessRate.add(checkoutOk);
          check(checkoutRes, { "spike checkout succeeds": () => checkoutOk });
        }

        sleep(0.1);
      };
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-spike
  namespace: load
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          args:
            - run
            - --out
            - json=/tmp/results.json
            - /scripts/spike.js
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: script
          configMap:
            name: k6-spike-script
  backoffLimit: 0
