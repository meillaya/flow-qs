image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.104.0"
  pullPolicy: IfNotPresent

replicaCount: 1
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1

serviceAccount:
  create: true
  name: otel-collector
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP}
    - {name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP}
    - {name: health, port: 8889, targetPort: 8889, protocol: TCP}
    - {name: metrics, port: 8888, targetPort: 8888, protocol: TCP}

healthCheck:
  livenessPath: /
  readinessPath: /
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

collectorConfig: |
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
          max_recv_msg_size_mib: 16
        http:
          endpoint: 0.0.0.0:4318
          max_request_body_size: 16777216

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 400
      spike_limit_mib: 100
    k8sattributes/gateway:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata: [k8s.pod.name, k8s.pod.uid, k8s.deployment.name, k8s.namespace.name, k8s.node.name]
        labels:
          - {tag_name: service.name, key: app.kubernetes.io/name, from: pod}
          - {tag_name: app.kubernetes.io/component, key: app.kubernetes.io/component, from: pod}
    k8sattributes/passthrough:
      auth_type: serviceAccount
      passthrough: true
    resource/gateway:
      attributes:
        - {key: service.namespace, from_attribute: k8s.namespace.name, action: upsert}
        - {key: collector.id, from_attribute: k8s.pod.name, action: insert}
        - {key: deployment.environment, value: dev, action: upsert}
    batch:
      timeout: 5s
      send_batch_size: 1024
      send_batch_max_size: 2048

  connectors:
    servicegraph:
      latency_histogram_buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
      metrics_flush_interval: 15s
      store:
        ttl: 5s
        max_items: 10000

  exporters:
    otlp/tempo:
      endpoint: tempo.observability:4317
      tls: {insecure: true}
      sending_queue: {enabled: true, num_consumers: 4, queue_size: 1000}
      retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 10s, max_elapsed_time: 60s}
    otlphttp/loki:
      endpoint: http://loki.observability:3100/otlp
      sending_queue: {enabled: true, num_consumers: 2, queue_size: 500}
    prometheusremotewrite:
      endpoint: http://prometheus.observability:80/api/v1/write
      resource_to_telemetry_conversion: {enabled: true}

  extensions:
    health_check: {endpoint: 0.0.0.0:8889, path: /}

  service:
    extensions: [health_check]
    telemetry:
      logs: {level: info, encoding: console}
      metrics: {level: basic, address: 0.0.0.0:8888}
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes/gateway, resource/gateway, batch]
        exporters: [otlp/tempo, servicegraph]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes/passthrough, resource/gateway, batch]
        exporters: [otlphttp/loki]
      metrics:
        receivers: [otlp, servicegraph]
        processors: [memory_limiter, k8sattributes/gateway, resource/gateway, batch]
        exporters: [prometheusremotewrite]

agent:
  enabled: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}
  tolerations:
    - {operator: Exists}

agentCollectorConfig: |
  receivers:
    filelog:
      include:
        - /var/log/pods/ecom_*/*/*.log
        - /var/log/pods/incident_*/*/*.log
      exclude: [/var/log/pods/observability_*/*/*.log]
      include_file_path: true
      include_file_name: false
      start_at: end
      operators:
        - type: container
          id: container-parser

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 200
      spike_limit_mib: 50
    k8sattributes:
      auth_type: serviceAccount
      passthrough: false
      filter:
        node_from_env_var: KUBE_NODE_NAME
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
      extract:
        metadata: [k8s.pod.name, k8s.pod.uid, k8s.deployment.name, k8s.namespace.name, k8s.node.name, container.id, container.image.name]
        labels:
          - {tag_name: service.name, key: app.kubernetes.io/name, from: pod}
          - {tag_name: app.kubernetes.io/component, key: app.kubernetes.io/component, from: pod}
    resource/log_identity:
      attributes:
        - {key: service.namespace, from_attribute: k8s.namespace.name, action: upsert}
        - {key: deployment.environment, value: dev, action: upsert}
    batch:
      timeout: 5s
      send_batch_size: 1024
      send_batch_max_size: 2048

  exporters:
    otlp/gateway:
      endpoint: otel-collector.observability.svc:4317
      tls: {insecure: true}
      sending_queue: {enabled: true, num_consumers: 2, queue_size: 500}
      retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 10s, max_elapsed_time: 60s}

  extensions:
    health_check: {endpoint: 0.0.0.0:13133}

  service:
    extensions: [health_check]
    telemetry:
      logs: {level: info, encoding: console}
    pipelines:
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, resource/log_identity, batch]
        exporters: [otlp/gateway]

nodeSelector: {}
tolerations: []
affinity: {}
pod:
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: {type: RuntimeDefault}
