
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.104.0"
  pullPolicy: IfNotPresent

# Replicas — 2 is the minimum for HA; the collector is stateless and easily
# scaled horizontally because the memory_limiter + batch processors handle
# backpressure per-replica.
replicaCount: 2

# HPA stub — disabled by default; replicaCount above applies instead.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# ServiceAccount — k8sattributes processor needs to GET pods, namespaces,
# replicasets, and (optionally) nodes. Created by the chart.
serviceAccount:
  create: true
  name: otel-collector
  annotations: {}

# Resources — spec: requests 256Mi/256m, limits 512Mi/500m.
# The memory limit must be < memory_limiter.limit_mib (1024) so the limiter
# has headroom; with limit=512Mi the spike_limit=512Mi is a sane safe upper.
resources:
  requests:
    cpu: 256m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Service — ClusterIP exposes OTLP gRPC/HTTP and the health-check / pprof
# ports. The OTLP receivers are NOT exposed externally; only in-cluster
# services and the local observability stack talk to them.
service:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: health
      port: 8889
      targetPort: 8889
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: 8888
      protocol: TCP

# Health-check wiring. The OTel `health_check` extension serves a single
# path (default `/`); with `check_collector_pipeline.enabled: true` (set
# in collectorConfig below) the same path becomes readiness — exporters
# unreachable flip the path to 503. We use `/` for both probes; the
# spec mentioned `/live` and `/ready`, but the extension only exposes one
# path. Initial delay gives the OTLP receivers time to bind.
healthCheck:
  livenessPath: /
  readinessPath: /
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

# Keep in sync with infra/otel-collector/configmap.yaml.
collectorConfig: |
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
          max_recv_msg_size_mib: 16
        http:
          endpoint: 0.0.0.0:4318
          max_request_body_size: 16777216

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 1024
      spike_limit_mib: 512

    k8sattributes:
      auth_type: serviceAccount
      # passthrough=true: emit the signal even if K8s metadata extraction
      # fails (API blip, missing SA token) — the OTel receiver can't
      # backpressure on a missing metadata call. See configmap.yaml for
      # the full reasoning.
      passthrough: true
      filter:
        node_from_env_var: KUBE_NODE_NAME
      extract:
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.pod.start_time
        labels:
          - tag_name: app.kubernetes.io/component
            key: app.kubernetes.io/component
            from: pod
          - tag_name: app.kubernetes.io/name
            key: app.kubernetes.io/name
            from: pod
          - tag_name: app.kubernetes.io/part-of
            key: app.kubernetes.io/part-of
            from: pod

    resource:
      attributes:
        - key: service.namespace
          value: ecom
          action: upsert
        - key: collector.id
          from_attribute: k8s.pod.name
          action: insert

    attributes:
      actions:
        - key: deployment.environment
          value: dev
          action: upsert

    batch:
      timeout: 5s
      send_batch_size: 1024
      send_batch_max_size: 2048

  exporters:
    otlp/tempo:
      endpoint: http://tempo.observability:4317
      tls:
        insecure: true
      sending_queue:
        enabled: true
        num_consumers: 4
        queue_size: 1000
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 10s
        max_elapsed_time: 60s

    otlphttp/loki:
      endpoint: http://loki.observability:3100/otlp
      tls:
        insecure: true
      sending_queue:
        enabled: true
        num_consumers: 2
        queue_size: 500

    prometheusremotewrite:
      endpoint: http://prometheus.observability:80/api/v1/write
      tls:
        insecure: true
      resource_to_telemetry_conversion:
        enabled: true

  extensions:
    health_check:
      endpoint: 0.0.0.0:8889
      path: /

  service:
    extensions: [health_check]
    telemetry:
      logs:
        level: info
        encoding: console
        sampling:
          enabled: false
      metrics:
        level: basic
        address: 0.0.0.0:8888
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, attributes, batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, attributes, batch]
        exporters: [otlphttp/loki]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, attributes, batch]
        exporters: [prometheusremotewrite]

# Pod placement — keep the collector on control-plane-friendly nodes; the
# memory_limiter makes per-pod memory pressure survivable, but we still want
# to spread the 2 replicas.
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
          topologyKey: kubernetes.io/hostname

# Pod-level — termination grace > batch timeout so we flush in-flight data.
pod:
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
