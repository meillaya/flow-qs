apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-collector.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
data:
  # collector.yaml is the OTel Collector pipeline. Inlined from
  # .Values.collectorConfig so the chart is self-contained — there is no
  # separate file-mount step.
  collector.yaml: |-
    {{- .Values.collectorConfig | nindent 4 }}
