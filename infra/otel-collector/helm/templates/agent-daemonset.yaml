{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "otel-collector.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "otel-collector.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: filelog-agent
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.agentCollectorConfig | sha256sum }}
      labels:
        {{- include "otel-collector.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: filelog-agent
    spec:
      serviceAccountName: {{ include "otel-collector.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: otel-filelog-agent
          image: {{ include "otel-collector.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [--config=/conf/collector.yaml]
          env:
            - {name: GOMEMLIMIT, value: "200MiB"}
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          ports:
            - {name: health, containerPort: 13133, protocol: TCP}
          livenessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ include "otel-collector.fullname" . }}-agent-config}
        - name: pod-logs
          hostPath: {path: /var/log/pods, type: Directory}
        - name: tmp
          emptyDir: {}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
