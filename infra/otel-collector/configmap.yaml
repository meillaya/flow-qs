apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: observability-platform
data:
  # Source-of-truth OTel Collector pipeline. Mirrored into the Helm chart's
  # values.yaml (otel-collector.helm.values.yaml -> collectorConfig). Keep
  # both in sync; the top-level file is what you can `kubectl apply -f`
  # directly when you want a non-Helm deployment.
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 16
          http:
            endpoint: 0.0.0.0:4318
            # 16 MiB cap on the HTTP body. Anything larger is rejected with 413.
            max_request_body_size: 16777216

    processors:
      # Must be first in any pipeline: refuses new data when memory pressure
      # exceeds the spike limit, forcing the receiver to apply backpressure
      # to the client (gRPC returns RESOURCE_EXHAUSTED, HTTP returns 429).
      memory_limiter:
        check_interval: 1s
        limit_mib: 1024
        spike_limit_mib: 512

      # Enrich every datapoint with k8s metadata (pod, namespace, node, labels,
      # annotations). Uses the KUBERNETES_SERVICE_HOST env that every pod gets,
      # plus the downward-API env var OTEL_K8S_NAMESPACE injected from
      # metadata.namespace so the API calls are namespaced and RBAC-scoped.
      k8sattributes:
        auth_type: serviceAccount
        # passthrough: when the K8s API is unreachable (cluster bootstrap,
        # API server hiccup), still emit the signal — just without the
        # enriched metadata. Setting this to false would drop everything
        # on any API blip, which the OTel receiver layer cannot
        # backpressure on.
        passthrough: true
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
          labels:
            - tag_name: app.kubernetes.io/component
              key: app.kubernetes.io/component
              from: pod
            - tag_name: app.kubernetes.io/name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: app.kubernetes.io/part-of
              key: app.kubernetes.io/part-of
              from: pod

      resource:
        attributes:
          - key: service.namespace
            value: ecom
            action: upsert
          - key: collector.id
            from_attribute: k8s.pod.name
            action: insert

      attributes:
        actions:
          - key: deployment.environment
            value: dev
            action: upsert

      # Always last in the pipeline: batches for efficient export.
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048

    exporters:
      otlp/tempo:
        endpoint: http://tempo.observability:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 10s
          max_elapsed_time: 60s

      otlphttp/loki:
        endpoint: http://loki.observability:3100/otlp
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 500

      # Metrics -> Prometheus remote-write. Does NOT take a `sending_queue`
      # block in 0.104.0 (rejection on a full queue); the in-memory queue
      # is implicit in the wal/rw client.
      prometheusremotewrite:
        endpoint: http://prometheus.observability:80/api/v1/write
        tls:
          insecure: true
        resource_to_telemetry_conversion:
          enabled: true

    # Extension: self-health check on :8889. `check_collector_pipeline` is
    # intentionally DISABLED — it flips the endpoint to 503 when an
    # exporter is unreachable, which kubelet reads as "kill this pod".
    # The collector is HA (2 replicas, memory_limiter) and will keep
    # retrying; surfacing that as a liveness failure would amplify the
    # outage instead of degrading. Pipeline health is observed through
    # the self-telemetry metrics on :8888 instead.
    extensions:
      health_check:
        endpoint: 0.0.0.0:8889
        path: /

    # Service: wire extensions + pipelines. Telemetry logs at info so we can
    # see the collector's own log lines (startup, dropped data, retries).
    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
          encoding: console
          sampling:
            enabled: false
        metrics:
          level: basic
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, attributes, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, attributes, batch]
          exporters: [otlphttp/loki]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, attributes, batch]
          exporters: [prometheusremotewrite]
