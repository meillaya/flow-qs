## infra/prometheus/configmap.yaml
##
## Custom prometheus.yml for the observability platform.
## Mounted by the prometheus server pod via:
##   server.configMapOverrideName = "prometheus-config"   (set in helm-values.yaml)
##
## The release-time ConfigMap name is:
##   {{ release-name }}-prometheus-config
##
## Scrape jobs:
##   1. prometheus        — self-scrape on :9090
##   2. otel-collector    — OTel Collector's internal metrics endpoint :8889
##   3. kube-state-metrics — service-discovered, label-matched
##   4. kubernetes-pods   — pods with prometheus.io/scrape=true annotation in
##                          the {ecom, observability, incident} namespaces only
##
## Note on path: prometheus.yml is what server.configPath (/etc/config/prometheus.yml)
## expects — keep the data key as `prometheus.yml`.

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-prometheus-config
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
      external_labels:
        cluster: observability-demo
        monitor: prometheus

    rule_files:
      - /etc/prometheus/rules/recording/*.yaml
      - /etc/prometheus/rules/alerts/*.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.observability.svc.cluster.local:9093

    scrape_configs:
      # 1. Prometheus self-scrape
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      # 2. OpenTelemetry Collector self-monitoring
      # OTel Collector's default telemetry endpoint exposes Prometheus-format
      # metrics on :8889/metrics. We scrape it directly so application-level
      # metric flow is observable in Prometheus even before remote_write is wired.
      - job_name: otel-collector
        static_configs:
          - targets:
              - otel-collector.observability.svc.cluster.local:8888
            labels:
              service: otel-collector

      # 3. kube-state-metrics (provided by the kube-state-metrics subchart)
      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_service_label_app_kubernetes_io_name
            regex: kube-state-metrics
            action: keep

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # only pods that explicitly opt-in
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # restrict to project namespaces
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: "ecom|observability|incident"
          # honor prometheus.io/port annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: (\d+)
            target_label: __address__
            replacement: "$1"
          # combine pod IP + port into __address__: IPv4 form
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_ip
            action: replace
            regex: (.+);((([0-9]+?)(\.|$)){4})
            target_label: __address__
            replacement: "$2:$1"
          # combine pod IP + port into __address__: IPv6 form
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_ip
            action: replace
            regex: (.+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
            target_label: __address__
            replacement: "[$2]:$1"
          # honor prometheus.io/scheme annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            regex: (https?)
            target_label: __scheme__
          # honor prometheus.io/path annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # promote any prometheus.io/param_<name> annotations
          - action: labelmap
            regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
            replacement: __param_$1
          # standard label promotion
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: Pending|Succeeded|Failed|Completed
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: node
