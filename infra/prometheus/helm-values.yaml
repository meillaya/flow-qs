## infra/prometheus/helm-values.yaml
##
## Helm values overrides for prometheus-community/prometheus (umbrella chart).
## Consumed by:
##   helm install prometheus prometheus-community/prometheus -n observability \
##     -f infra/prometheus/helm-values.yaml --create-namespace
##
## Design notes:
## - Retention 31d is longer than Tempo/Loki (7d) because Prometheus metrics are
##   cheap and the SLO multi-window burn-rate math (Task 15/16) benefits from a
##   31d window covers the full 30d SLO evaluation window).
## - `server.configMapOverrideName` defers the full Prometheus config to
##   `infra/prometheus/configmap.yaml`, which is applied independently.
## - Alertmanager config is inlined under `alertmanager.config`; the equivalent
##   standalone file lives at `infra/prometheus/alertmanager-config.yaml`.
## - Pushgateway is disabled per design (pull-model only, see plan guardrail).
## - kube-state-metrics is enabled for pod-level metrics required by SLO/alert
##   rules (Task 15/16).

server:
  fullnameOverride: prometheus
  retention: "31d"
  extraFlags:
    - web.enable-remote-write-receiver
  persistentVolume:
    size: 20Gi

  global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s

  ## Mount our own prometheus.yml ConfigMap instead of letting the chart render
  ## the default scrape configs. The ConfigMap must contain a `prometheus.yml`
  ## key (matching server.configPath = /etc/config/prometheus.yml).
  configMapOverrideName: prometheus-config

  extraConfigmapMounts:
    - name: recording-rules
      mountPath: /etc/prometheus/rules/recording
      configMap: prom-rules-recording
      readOnly: true
    - name: alert-rules
      mountPath: /etc/prometheus/rules/alerts
      configMap: prom-rules-alerts
      readOnly: true

  ## Explicitly disable anything that could forward to a remote system.
  remoteWrite: []
  remoteRead: []

## Alertmanager subchart configuration. Mirrors infra/prometheus/alertmanager-config.yaml.
alertmanager:
  enabled: true
  fullnameOverride: alertmanager
  persistence:
    enabled: true
    size: 2Gi
  config:
    global:
      resolve_timeout: 5m
    templates:
      - /etc/alertmanager/*.tmpl
    route:
      receiver: incident-engine
      group_by: [alertname, service]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 4h
      routes:
        - matchers:
            - severity = "dropped-test"
          receiver: "null"
    receivers:
      - name: incident-engine
        webhook_configs:
          - url: http://incident-engine.incident.svc.cluster.local:8088/webhook
            send_resolved: true
      - name: "null"
    inhibit_rules:
      - source_matchers:
          - alertname = "ServiceDown"
        target_matchers:
          - alertname =~ "HighErrorRate|HighLatencyP99"
        equal:
          - service
  templates:
    default.tmpl: |-
      {{ define "default.title" -}}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }} for {{ .GroupLabels.service }}
      {{- end }}

      {{ define "default.message" -}}
      {{ range .Alerts -}}
      Alert: {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}
      Status: {{ .Status }}
      Severity: {{ if .Labels.severity }}{{ .Labels.severity }}{{ else }}unknown{{ end }}
      Service: {{ if .Labels.service }}{{ .Labels.service }}{{ else }}unknown{{ end }}
      Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
      Annotations: {{ range .Annotations.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
      Source: {{ .GeneratorURL }}
      ---
      {{ end }}
      {{- end }}

      {{ define "incident-engine.payload" -}}
      {
        "receiver": "{{ .Receiver }}",
        "status": "{{ .Status }}",
        "alerts": [
          {{ range $i, $a := .Alerts }}{{ if $i }},{{ end }}
          {
            "status": "{{ $a.Status }}",
            "labels": { {{ range $j, $p := $a.Labels.SortedPairs }}{{ if $j }},{{ end }}"{{ $p.Name }}": "{{ $p.Value }}"{{ end }} },
            "annotations": { {{ range $j, $p := $a.Annotations.SortedPairs }}{{ if $j }},{{ end }}"{{ $p.Name }}": "{{ $p.Value }}"{{ end }} },
            "startsAt": "{{ $a.StartsAt }}",
            "endsAt": "{{ $a.EndsAt }}",
            "generatorURL": "{{ $a.GeneratorURL }}"
          }{{ end }}
        ],
        "groupLabels": { {{ range $i, $p := .GroupLabels.SortedPairs }}{{ if $i }},{{ end }}"{{ $p.Name }}": "{{ $p.Value }}"{{ end }} },
        "commonLabels": { {{ range $i, $p := .CommonLabels.SortedPairs }}{{ if $i }},{{ end }}"{{ $p.Name }}": "{{ $p.Value }}"{{ end }} },
        "commonAnnotations": { {{ range $i, $p := .CommonAnnotations.SortedPairs }}{{ if $i }},{{ end }}"{{ $p.Name }}": "{{ $p.Value }}"{{ end }} },
        "externalURL": "{{ .ExternalURL }}",
        "version": "{{ .Version }}"
      }
      {{- end }}

## kube-state-metrics subchart — provides pod/deployment/statefulset metrics
## referenced by Task 15 SLO recoding rules and Task 16 alert rules.
kube-state-metrics:
  enabled: true

## node-exporter: keep enabled (default). Captures node-level CPU/memory/disk
## metrics used by infra dashboards.
prometheus-node-exporter:
  enabled: true

## Pushgateway: DISABLED per plan guardrail ("No Prometheus pushgateway").
prometheus-pushgateway:
  enabled: false

## NetworkPolicy off — cluster is local k3d, port-forward only.
networkPolicy:
  enabled: false
