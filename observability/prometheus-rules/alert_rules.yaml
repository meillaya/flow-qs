groups:
  - name: alert_rules_cart_service
    interval: 30s
    rules:
      - alert: SLOAvailabilityBurnTooFast
        expr: |
          {__name__="sli:cart-service:availability:ratio_1h"} < 0.9856000000
          and
          {__name__="sli:cart-service:availability:ratio_6h"} < 0.9940000000
        for: 2m
        labels:
          severity: "page"
          service: "cart-service"
          slo_kind: "availability"
          burn_window_long: "6h"
          burn_window_short: "1h"
        annotations:
          summary: "cart-service SLO availability burn rate is unsustainable"
          description: "cart-service availability SLO (0.9990) is being consumed at >=14.4x (1h) and >=6x (6h) the normal rate."
          runbook: "https://sre.google/workbook/alerting-on-slos/"
      - alert: SLOLatencyBurnTooFast
        expr: |
          {__name__="sli:cart-service:latency_p99:ratio_1h"} < 0.8560000000
          and
          {__name__="sli:cart-service:latency_p99:ratio_6h"} < 0.9400000000
        for: 2m
        labels:
          severity: "page"
          service: "cart-service"
          slo_kind: "latency_p99"
          burn_window_long: "6h"
          burn_window_short: "1h"
        annotations:
          summary: "cart-service SLO latency_p99 burn rate is unsustainable"
          description: "cart-service latency_p99 SLO (0.9900) is being consumed at >=14.4x (1h) and >=6x (6h) the normal rate."
          runbook: "https://sre.google/workbook/alerting-on-slos/"
      - alert: SLOAvailabilityBurnTooFast
        expr: |
          {__name__="sli:cart-service:availability:ratio_6h"} < 0.9940000000
          and
          {__name__="sli:cart-service:availability:ratio_3d"} < 0.9990000000
        for: 30m
        labels:
          severity: "warning"
          service: "cart-service"
          slo_kind: "availability"
          burn_window_long: "3d"
          burn_window_short: "6h"
        annotations:
          summary: "cart-service SLO availability budget is draining steadily"
          description: "cart-service availability SLO (0.9990) is being consumed at >=6x (6h) and >=1x (3d) the normal rate."
          runbook: "https://sre.google/workbook/alerting-on-slos/"
      - alert: SLOLatencyBurnTooFast
        expr: |
          {__name__="sli:cart-service:latency_p99:ratio_6h"} < 0.9400000000
          and
          {__name__="sli:cart-service:latency_p99:ratio_3d"} < 0.9900000000
        for: 30m
        labels:
          severity: "warning"
          service: "cart-service"
          slo_kind: "latency_p99"
          burn_window_long: "3d"
          burn_window_short: "6h"
        annotations:
          summary: "cart-service SLO latency_p99 budget is draining steadily"
          description: "cart-service latency_p99 SLO (0.9900) is being consumed at >=6x (6h) and >=1x (3d) the normal rate."
          runbook: "https://sre.google/workbook/alerting-on-slos/"
      - alert: ServiceDown
        expr: |
          min(synthetic_check_success{service=~"cart-service([.][^:]+)?:[0-9]+"}) == 0
        for: 1m
        labels:
          severity: "page"
          service: "cart-service"
        annotations:
          summary: "cart-service is reporting as down"
          description: "cart-service failed synthetic health checks for at least one minute."
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5..", service_name="cart-service"}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="cart-service"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: "page"
          service: "cart-service"
        annotations:
          summary: "cart-service 5xx ratio > 5%"
          description: "cart-service emitted >5% 5xx responses for 5 minutes."
      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="cart-service"}[5m]))
          ) > 0.2000
        for: 5m
        labels:
          severity: "warning"
          service: "cart-service"
          threshold_p99_s: "0.2000"
          critical_p99_s: "0.4000"
        annotations:
          summary: "cart-service p99 latency > 200ms"
          description: "cart-service p99 latency exceeded 2x the SLO threshold (100ms) for 5 minutes."
