apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: flow-qs
      app.kubernetes.io/component: prometheus-rules

configMapGenerator:
  - name: prom-rules-recording
    files:
      - sli_recording_rules.yaml
    options:
      disableNameSuffixHash: true
  - name: prom-rules-alerts
    files:
      - alert_rules.yaml
    options:
      disableNameSuffixHash: true

resources: []
