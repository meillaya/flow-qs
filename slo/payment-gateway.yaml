service: payment-gateway
slos:
  - name: availability
    sli:
      spec: http_server_request_duration_seconds_count{http_response_status_code!~"5.."}
      total_spec: http_server_request_duration_seconds_count
    objective: 0.995
    window: 30d
    error_budget: 216m0s
  - name: latency_p99
    sli:
      spec: http_server_request_duration_seconds_bucket{le="1.0"}
      total_spec: http_server_request_duration_seconds_count
    objective: 0.99
    window: 30d
    error_budget: 432m0s
