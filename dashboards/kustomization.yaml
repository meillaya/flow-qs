# ----------------------------------------------------------------------------
# Kustomization for the 10 provisioned Grafana dashboards (Task 17).
#
# The grafana/grafana chart's sidecar.dashboards is enabled in
# infra/grafana/helm-values.yaml and watches for ConfigMaps labeled
# `grafana_dashboard: "1"`. Each JSON file in this directory is embedded
# into a single ConfigMap whose key matches the file name; the sidecar then
# loads the dashboards at startup.
#
# Apply with:
#   kubectl apply -k dashboards
# ----------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ---- ConfigMap with all 10 dashboard JSON files -----------------------------
# The grafana_dashboard label is what the sidecar watches for. Keeping all
# files in a single ConfigMap keeps the cluster tidy and reduces etcd writes
# (10 keys in 1 ConfigMap vs 10 separate ConfigMaps).
configMapGenerator:
  - name: grafana-dashboards
    namespace: observability
    files:
      - 01-service-overview.json
      - 02-red-catalog.json
      - 02-red-inventory.json
      - 02-red-cart.json
      - 02-red-checkout.json
      - 02-red-order.json
      - 02-red-payment.json
      - 03-trace-explorer.json
      - 04-log-explorer.json
      - 05-slo-status.json
    options:
      disableNameSuffixHash: true
      labels:
        # Required: grafana sidecar selector
        grafana_dashboard: "1"
        # Tagging for kubectl / observability
        app.kubernetes.io/name: grafana-dashboards
        app.kubernetes.io/component: dashboards
        app.kubernetes.io/part-of: flow-qs
        app.kubernetes.io/managed-by: kustomize
      annotations:
        grafana.io/sidecar: dashboards
        grafana.io/folder: ecom

# ---- kustomize-level labels propagated to the ConfigMap --------------------
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: flow-qs
