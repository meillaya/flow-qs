apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability-platform.fullname" . }}
  labels:
    {{- include "observability-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "observability-platform.selectorLabels" . | nindent 4 }}
