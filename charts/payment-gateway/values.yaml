# Default values for payment-gateway.

# -- Human-readable service name; used for OTEL_SERVICE_NAME and selectors.
serviceName: "payment-gateway"

image:
  # -- Container image repository.
  repository: "k3d-observability-registry:5000/payment-gateway"
  # -- Container image tag.
  tag: "dev"
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Number of replicas.
replicaCount: 1

service:
  # -- HTTP service port exposed inside the cluster.
  port: 8005
  # -- HTTP container port the application listens on.
  targetPort: 8005
  # -- gRPC service port exposed inside the cluster.
  grpcPort: 50052
  # -- gRPC container port the application listens on.
  grpcTargetPort: 50052

probes:
  liveness:
    # -- HTTP path for the liveness probe.
    path: /healthz
  readiness:
    # -- HTTP path for the readiness probe.
    path: /readyz

resources:
  # -- Minimum resources guaranteed to the container.
  requests:
    memory: "256Mi"
    cpu: "256m"
  # -- Maximum resources the container may consume.
  limits:
    memory: "512Mi"
    cpu: "500m"

# -- Extra environment variables supplied as key/value pairs.
# These are rendered into a ConfigMap and injected into the container.
env: {}
#  LOG_LEVEL: info

# -- ServiceAccount configuration.
serviceAccount:
  # -- Specifies whether a ServiceAccount should be created.
  create: true
  # -- The name of the ServiceAccount to use.
  name: ""
