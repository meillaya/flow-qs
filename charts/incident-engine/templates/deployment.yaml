apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incidentengine.fullname" . }}
  labels:
    {{- include "incidentengine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "incidentengine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "incidentengine.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "incidentengine.serviceAccountName" . }}
      containers:
        - name: incident-engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.serviceName | default "incident-engine" | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name={{ .Values.serviceName | default "incident-engine" }},deployment.environment=dev"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: CHAOS_NAMESPACE
              value: {{ .Values.chaosApi.namespace | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: postmortems
              mountPath: /postmortems
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "incidentengine.fullname" . }}-data
        - name: postmortems
          persistentVolumeClaim:
            claimName: {{ include "incidentengine.fullname" . }}-postmortems
      {{- end }}