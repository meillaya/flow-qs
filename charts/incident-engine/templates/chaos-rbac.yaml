{{- if .Values.chaosApi.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "incidentengine.fullname" . }}-chaos-reader
  namespace: {{ .Values.chaosApi.namespace }}
  labels:
    {{- include "incidentengine.labels" . | nindent 4 }}
rules:
  - apiGroups: ["chaos-mesh.org"]
    resources:
      - podchaos
      - networkchaos
      - stresschaos
      - dnschaos
      - schedules
      - workflows
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "incidentengine.fullname" . }}-chaos-reader
  namespace: {{ .Values.chaosApi.namespace }}
  labels:
    {{- include "incidentengine.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "incidentengine.fullname" . }}-chaos-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "incidentengine.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
