# Overrides for the synthetic-monitor wrapper chart.

svc-template:
  # -- Service name used for selectors and OTEL_SERVICE_NAME.
  serviceName: synthetic-monitor

  image:
    repository: k3d-observability-registry:5000/synthetic-monitor
    tag: dev
    pullPolicy: Always

  replicaCount: 1

  service:
    port: 8000
    targetPort: 8000

  probes:
    liveness:
      path: /healthz
    readiness:
      path: /readyz

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  env:
    SYNTHETIC_TARGETS: "catalog-service.ecom.svc.cluster.local:8000,inventory-service.ecom.svc.cluster.local:8001,cart-service.ecom.svc.cluster.local:8002,checkout-service.ecom.svc.cluster.local:8003,order-service.ecom.svc.cluster.local:8004,payment-gateway.default.svc.cluster.local:8005"
    POLL_INTERVAL: "30"
    FAILURE_THRESHOLD: "3"

  serviceAccount:
    create: true
    name: ""

# -- Prometheus ServiceMonitor configuration.
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
