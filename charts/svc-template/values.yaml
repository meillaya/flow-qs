# Default values for svc-template.
# This is a reusable umbrella chart for Enten v2 services.

# -- Human-readable service name; used for OTEL_SERVICE_NAME and selectors.
serviceName: ""

image:
  # -- Container image repository.
  repository: ""
  # -- Container image tag.
  tag: "dev"
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Number of replicas.
replicaCount: 1

service:
  # -- Service port exposed inside the cluster.
  port: 8000
  # -- Container port the application listens on.
  targetPort: 8000

probes:
  liveness:
    # -- HTTP path for the liveness probe.
    path: /healthz
  readiness:
    # -- HTTP path for the readiness probe.
    path: /readyz

resources:
  # -- Minimum resources guaranteed to the container.
  requests:
    memory: "256Mi"
    cpu: "256m"
  # -- Maximum resources the container may consume.
  limits:
    memory: "512Mi"
    cpu: "500m"

# -- Extra environment variables supplied as key/value pairs.
# These are rendered into a ConfigMap and injected into the container.
env: {}
#  LOG_LEVEL: info

# -- ServiceAccount configuration.
serviceAccount:
  # -- Specifies whether a ServiceAccount should be created.
  create: true
  # -- The name of the ServiceAccount to use.
  name: ""
