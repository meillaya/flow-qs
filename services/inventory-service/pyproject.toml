[project]
name = "inventory-service"
version = "0.1.0"
description = "Inventory service with FastAPI, gRPC, SQLite, and OTel instrumentation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "grpcio>=1.68",
    "grpcio-reflection>=1.68",
    "grpcio-tools>=1.68",
    "protobuf>=5.28",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49",
    "opentelemetry-instrumentation-sqlite3>=0.49",
    "opentelemetry-instrumentation-grpc>=0.49",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "grpcio-tools>=1.68",
    "ruff>=0.7",
    "ty>=0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["app/grpc_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
replace-imports-with-any = ["app.grpc_gen.inventory_pb2", "app.grpc_gen.inventory_pb2_grpc"]

[tool.ty.src]
exclude = ["app/grpc_gen"]
