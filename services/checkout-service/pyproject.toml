[project]
name = "checkout-service"
version = "0.1.0"
description = "Checkout orchestrator with saga-style rollback and failure injection"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
    "protobuf>=5.27.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-grpc>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-distro>=0.48b0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[dependency-groups]
dev = ["ty>=0.0.57"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ty.src]
exclude = ["app/proto_gen/*_pb2_grpc.py"]

[tool.ruff]
exclude = ["app/proto_gen"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B008", "E402"]
"app/proto_gen/**/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["app/proto_gen/"]
disable_error_code = ["misc", "attr-defined", "var-annotated", "type-var"]
