syntax = "proto3";

package inventory.v1;

option go_package = "github.com/enten-v2/inventory-service/proto/inventory/v1";

service InventoryService {
  // Check current available stock for a SKU.
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);
  // Atomically reserve `quantity` units. Returns RESERVE_STATUS_INSUFFICIENT
  // when not enough stock is available. Reservation_id is required for release.
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
  // Release a previously created reservation. Idempotent on the same
  // reservation_id (no-op if already released).
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
}

message CheckStockRequest {
  string sku = 1;
}

message CheckStockResponse {
  string sku = 1;
  int32 available = 2;
  int32 reserved = 3;
}

message ReserveStockRequest {
  string sku = 1;
  int32 quantity = 2;
}

message ReserveStockResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_INSUFFICIENT = 2;
  }
  Status status = 1;
  string reservation_id = 2; // present only when status == STATUS_OK
}

message ReleaseStockRequest {
  string reservation_id = 1;
  string sku = 2;
  int32 quantity = 3;
}

message ReleaseStockResponse {
  bool released = 1;
}
