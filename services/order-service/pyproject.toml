[project]
name = "order-service"
version = "0.1.0"
description = "Order service with FastAPI + SQLite + OTel + gRPC client"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "grpcio>=1.64.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlite3>=0.48b0",
    "opentelemetry-instrumentation-grpc>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-distro>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "grpcio-tools>=1.64.0",
]

[dependency-groups]
dev = ["ty>=0.0.57"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ty.src]
exclude = ["app/proto/*_pb2_grpc.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["app/proto/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["UP009", "UP017"]

[tool.mypy]
python_version = "3.12"
exclude = ["app/proto"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
